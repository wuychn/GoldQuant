# R2 策略配置（决策唯一来源，不读 R1 scoring 段）

regime:
  strong_zt_min: 60
  weak_zt_max: 29
  strong_index_chg: 0.5

sector:
  board_top_n: 10
  lifecycle:
    sprout_max_days: 2
    fade_out_of_rank_days: 2
  defensive_names:
    - 银行
    - 证券
    - 保险
    - 保险及其他
    - 煤炭
    - 公用事业

pool:
  tracking_max: 50
  combat_max_strong: 12
  combat_max_neutral: 10
  combat_max_weak: 0
  tracking_min_days_before_combat: 1
  promote_min_structure_score: 65

entry:
  enabled: true
  # 弱势已在 generate_buy_signals 入口禁买；震荡/强势均允许 ascent+pullback
  confirmation: true

exit:
  stop_loss_pct: 7.0
  trailing_profit_pct: 5.0
  trailing_drop_pct: 4.0

ml:
  mode: gate
  min_prob: 0.52
  model_stock_rank: stock_rank.lgb
  model_sector_fade: sector_fade.lgb

backtest:
  initial_cash: 500000
