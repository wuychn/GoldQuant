# 行业名称映射（仅行业域；概念不做映射，概念与行业互不交叉）
#
# 编写约定（aliases 块）：
#   键 key   → 同花顺：行业一览表 hyylb「板块」名（行业榜 canonical，评分数据侧）
#   列表项   → 东财：jbxx「行业」或东财行业板块名（个股 enrich 侧）
#
# 只写经 jbxx 缓存 / 东财板块列表核对过的条目，禁止凭常识猜测。
# 示例：塑料（东财 jbxx）→ 塑料制品（同花顺）
#
# 刷新：python -m quant industry_aliases_draft（合并自动推断，不覆盖已有项）
aliases:
  IT服务: # 同花顺
    - IT服务Ⅱ # 东财 jbxx
  其他社会服务: # 同花顺
    - 工程咨询服务Ⅱ # 东财 jbxx
  塑料制品: # 同花顺
    - 塑料 # 东财 jbxx
  非金属材料: # 同花顺
    - 玻璃玻纤 # 东财 jbxx
  食品加工制造: # 同花顺
    - 休闲食品 # 东财 jbxx
