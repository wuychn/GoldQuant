# GoldQuant 业务/策略配置。包内默认；用户覆盖：~/.quant/config/quant.yml（deep merge）。
# 仅环境/敏感项（端口、密钥、代理、路径）走 .env；业务阈值、调度时点、门禁在此。
# 每项说明见 docs/CONFIG.md。校验：quant/yml_schema.py。

gates:
  symbol_pool:
    prefixes:
    - '60'
    - '00'
    - '30'
    - '688'
    exclude_st: true
data:                          # 数据源并发限流
  default_max_concurrent: 1
  akshare_max_concurrent: 1     # AKShare 并发（过高易限流）
  ths_max_concurrent: 1         # 同花顺并发
  eastmoney_max_concurrent: 1  # 东财并发
  fund_flow_rank_page_size: 100
  fund_flow_rank_max_pages: 5
  req_page_interval: "61,121"     # 页间；CLI --req-page-interval
  req_symbol_interval: "5,10"     # 逐票；CLI --req-symbol-interval
  req_batch_pause: "120,240"      # 批间/失败跳页暂停；CLI --req-batch-pause
  req_burst_pages: "1,3"          # 每成功 N 页批停；CLI --req-burst-pages
  sources:
    # 四类（daily/market/enrich/info）均支持接口级换源 + 数据驱动 fallback：
    #   整源：daily: default                  # 所有接口走同一实现，不 fallback
    #   接口级单值：daily: {fetch_spot: sina}  # 只用这个源，不 fallback
    #   接口级列表：daily: {fetch_spot: [sina, akshare]}  # 按序尝试，失败换下一个，全失败抛异常
    #     加新源 = 实现源类 + 注册 registry + yml list 加名字，业务层永不改。
    #   现有源（未实现某接口抛 NotImplementedError）：
    #     daily:  default(组合)/akshare(东财全)/sina(spot·hist·index)/tencent(仅 hist)
    #     market: default(组合)/akshare(eastmoney系)/eastmoney(涨停池·行业·停牌·严重异动)/ths(同花顺系)/sina(行业)
    #     enrich: default(组合)/eastmoney(盘口·资金流日线)/ths(资金流·概念粘合度)/
    #             wencai(问财概念)/akshare(当日分钟K)
    #     info:   default(组合)/akshare(新闻)/eastmoney(个股基本信息)
    daily:
      fetch_spot: [sina, akshare]
      fetch_hist: [sina, akshare]
      fetch_index: [sina, akshare]
    market:
      fetch_industry_map: [sina, eastmoney]
      fetch_concept_boards: [akshare, ths, default]
      # 仅 eastmoney：akshare/default 同源实现，多源 fallback 只会反复打同一断页
      fetch_stock_fund_flow_rank: eastmoney
      fetch_zt_pool_hist: eastmoney        # 东财涨停池（ak.stock_zt_pool_em(date)），可按日回填
      fetch_zt_zb_pool: eastmoney          # 炸板股池（历史窗口短）
      fetch_zt_dt_pool: eastmoney          # 跌停股池（历史窗口短）
      fetch_zt_prev_pool: eastmoney        # 昨日涨停今日表现
      fetch_severe_anomaly: eastmoney      # 东财严重异动列表（仅当日；临界涨幅用源站，不本地重算）
      fetch_lhb_day: eastmoney             # 当日龙虎榜明细。只归档观察池，策略不读
    enrich:
      fetch_stock_quote: [eastmoney, default]
      fetch_stock_fund_flow: [ths, default]
      fetch_stock_fund_flow_daily: [eastmoney, akshare, default]
      fetch_concept_fit_rank: [ths, default]
      fetch_stock_concepts: [wencai, default]
      fetch_stock_minute: [akshare, default]
    info:
      fetch_stock_info: [eastmoney, default]
scheduler:
  enabled: true
  timezone: Asia/Shanghai
  update_daily_time: "16:00"
  maintain_weekly_day: "fri"
  maintain_weekly_time: "22:00"
  daily_decision_time: "20:10"
  misfire_grace_sec: 600
