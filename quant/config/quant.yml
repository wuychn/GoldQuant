# =============================================================================
# GoldQuant 量化统一配置
# =============================================================================
# 策略：仅主升浪战法
#
# 加载顺序
#   1. quant/config/quant.yml（本文件，包内默认）
#   2. ~/.quant/config/quant.yml（用户覆盖，deep merge）
#   3. ~/.quant/config/ml_calibration.yml（可选用户覆盖，R1 九维分已移除）
# =============================================================================

# -----------------------------------------------------------------------------
# scoring — 候选 enrich + brief 展示参考（R2 决策不读九维分）
# -----------------------------------------------------------------------------
scoring:

  # brief/推送 min_score 缺省参考
  watchlist_threshold: 70

  # 晚间候选 enrich（初筛 quant/candidates/sources.py，问财+enrich 在 quant/candidates/pipeline.py）
  candidate:
    popularity_limit: 20        # 人气榜初筛：取前 N
    zt_min_boards: 3            # 涨停池初筛：连板数 ≥（晚间复盘仅纳入 3 板及以上）
    cxg_labels:                # 同花顺创新高类型
      - 创月新高
      - 半年新高
      - 一年新高
      - 历史新高
    include_zt_pool: false       # 涨停池不进入晚间自选候选
    include_ths_rank_pool: true  # 同花顺形态榜（创新高/持续上涨/持续放量/量价齐升）

# -----------------------------------------------------------------------------
# regime / sector / pool — 决策内核（环境→板块→双池）
# -----------------------------------------------------------------------------
regime:
  strong_zt_min: 60
  weak_zt_max: 29
  strong_index_chg: 0.5

sector:
  board_top_n: 10
  use_ak_breadth: true
  breadth_cache:
    allow_live_ak: true
    max_workers: 4
    request_delay_sec: 0.15
  lifecycle:
    sprout_max_days: 2
    fade_out_of_rank_days: 2
  factors:
    weights:
      rs: 0.25
      fund: 0.25
      breadth: 0.20
      persistence: 0.15
      rank: 0.15
    eligible_min: 55
    ban_max: 35
  defensive_names:
    - 银行
    - 证券
    - 保险
    - 保险及其他
    - 煤炭
    - 公用事业

pool:
  tracking_max: 50
  combat_max_strong: 12
  combat_max_neutral: 10
  combat_max_weak: 0
  tracking_min_days_before_combat: 1
  promote_min_structure_score: 65
  tracking_min_alpha: 55
  promote_min_alpha: 65

stock_factors:
  weights:
    structure: 0.45
    rs_index: 0.20
    rs_sector: 0.20
    momentum: 0.15

entry:
  enabled: true
  confirmation: true

exit:
  stop_loss_pct: 7.0
  trailing_profit_pct: 5.0
  trailing_drop_pct: 4.0

ml:
  mode: gate
  min_prob: 0.52
  model_stock_rank: stock_rank.lgb
  model_sector_fade: sector_fade.lgb

backtest:
  initial_cash: 500000

portfolio:
  default_assets: 500000
  per_stock_max_pct: 0.18
  risk_budget_pct: 0.90

risk:
  enabled: true
  max_deploy_pct: 0.95
  max_single_name_pct: 0.20
  max_sector_pct: 0.35
  max_drawdown_halt_pct: 15

research:
  enabled: true
  pool_research_limit: 4
  prefetch_ak_on_evening: true

# -----------------------------------------------------------------------------
# gates — 硬门禁 + 战法参数 + 三确认（不可被 LLM 修改）
# -----------------------------------------------------------------------------
gates:

  # 模拟成交时段校验（executor.py）
  trading:
    time_validation_enabled: true  # true=仅连续竞价时段允许成交
    simulation:
      commission_rate: 0.0001     # 佣金万一（买卖双向）
      min_commission: 5.0         # 单笔最低佣金（元）
      stamp_tax_rate: 0.0005      # 卖出印花税 0.05%
      transfer_fee_rate: 0.00001  # 沪市过户费 0.001%（仅 6 开头）
      slippage_pct: 0.001         # 滑点 0.1%
      main_limit_pct: 9.9         # 主板涨跌停阈值（%）
      gem_limit_pct: 19.9         # 创业板/科创板涨跌停阈值（%）

  # 可交易标的池
  symbol_pool:
    prefixes: ["60", "00", "30"]    # 沪主/深主/创业板
    exclude_st: true                # 排除 ST
    min_listing_days: 60            # 最短上市天数（预留）

  # 全局熔断：指数大跌
  circuit_breaker:
    index_drop_pct: -2.0            # 上证涨跌幅 ≤ 此值 → 禁止新开仓

  daily_loss_limit_pct: -3.0        # 当日已实现盈亏占总资产 ≤ 此值 → 禁止新开仓
  stoploss_cooldown_days: 3         # 止损卖出后 N 日内不再买同代码
  block_same_day_rebuy_after_sell: true  # 当日卖出过的代码当日不再买入

  # 持续确认：当日锁存 + 累计命中（第 N 次仍满足时成交；跨日清）
  confirmation:
    day_latch:
      enabled: true                 # 首次触发当日锁存至收盘；缺轮不清零累计
    default_min_span_minutes: 3      # 自首次触发起最短间隔（分钟）
    default_min_day_hits: 2           # 当日累计命中次数（不必连续）
    default_persistence_minutes: 3   # 兼容旧键 → min_span_minutes
    default_min_consecutive_runs: 2   # 兼容旧键 → min_day_hits
    max_window_minutes: 180
    buy_policy:
      use_trading_minutes: true       # 买入：间隔按连续竞价分钟（剔除午休）
      verify_before_execute: true   # 买入：成交前再验趋势/评分/分时
    sell_policy:
      verify_before_execute: true   # 卖出：成交前再验卖点仍成立
    skip_count_modes:
      - pre_market
    by_kind:
      止损:
        min_span_minutes: 0
        min_day_hits: 1
      日内走弱:
        min_span_minutes: 10
        min_day_hits: 2
      上升途中:
        min_span_minutes: 10
        min_day_hits: 2
      回调企稳:
        min_span_minutes: 15
        min_day_hits: 2
      # 破5日线 / 趋势衰竭：卖出侧仍偏长确认
      破5日线:
        min_span_minutes: 20
        min_day_hits: 3
      趋势衰竭:
        min_span_minutes: 30
        min_day_hits: 3
        max_window_minutes: 4320
        multi_day: true              # 允许多日累计，非日锁存
    强势:
      min_span_minutes: 10
      min_day_hits: 2
      max_window_minutes: 120
    震荡:
      min_span_minutes: 10
      min_day_hits: 2
      max_window_minutes: 180
    弱势:
      min_span_minutes: 15
      min_day_hits: 2
      max_window_minutes: 240

  # 概念板块：滑动窗口四榜快照 + concept_theme 概念权重；仅晚间复盘写入状态
  concept_tracker:
    board_limit: 10                 # 每日快照：涨/跌/流入/流出榜各取前 N
    lookback_days: 10               # 指标计算窗口（交易日，含当日 payload）
    recency_decay: 0.88             # 时间衰减：越近权重越大（1.0=等权）；当日=1，9日前≈0.35
    fund_log_scale: true            # 资金净流入 log1p 后再归一化，减弱极端值挤压
    normalize_mode: percentile       # percentile | minmax；百分位排名抗极端值
    presence_factor:                # 修正 percentile 把"几乎没上榜"的概念抬到 70+ 的问题
      enabled: true                 # 按窗口入选天数缩放原始分
      full_days: 2                  # 入选天数 >= 此值不衰减；不足则 raw 分 × (count/full_days, 封顶 1.0；count=0 → 0)
    dual_window:                    # 方案C：结构(持续性) + 动量(近端热度) 双窗口合成
      enabled: true
      structural_days: 10           # 结构窗口：看中期主线持续性
      momentum_days: 3              # 动量窗口：看近 3 日爆发
      structural_weight: 0.6
      momentum_weight: 0.4
    mode_overrides:                 # 盘中偏动量、晚间偏结构
      during_market:
        dual_window:
          structural_days: 7
          momentum_days: 3
          structural_weight: 0.45
          momentum_weight: 0.55
      pre_market:
        dual_window:
          structural_days: 10
          momentum_days: 5
          structural_weight: 0.65
          momentum_weight: 0.35
      post_market_evening:
        dual_window:
          structural_days: 10
          momentum_days: 5
          structural_weight: 0.65
          momentum_weight: 0.35
    # past_board_days 默认 lookback_days-1：评分池 = 文件过去 N 日榜 + 当日榜
    # 命中概念窗口排名分档：连续衰减系数 × raw 权重分（替代原 off_top_penalty -50 硬覆盖，消除 rank10/11 的 128 分悬崖）
    rank_tiers:
      decay:                          # 按命中概念窗口排名衰减 raw 分；rank 越靠后系数越小
        - {max_rank: 3, factor: 1.0, label: "前三"}
        - {max_rank: 7, factor: 0.8, label: "中游(4-7)"}
        - {max_rank: 10, factor: 0.6, label: "边缘(8-10)"}
        - {max_rank: 15, factor: 0.3, label: "榜外(11-15)"}
        - {max_rank: 100000, factor: 0.1, label: "榜外(16+)"}
      off_top_penalty: -50          # 保留旧字段；decay 配置存在时不再生效
      low_score: 5                  # 保留字段
    score_weights:                  # 概念权重：上榜次数 50 + 综合涨幅 30 + 净流入 20
      selection_count: 50           # 近 N 日累计入选涨/资金榜前十次数（同一日只计 1 次）
      composite_gain: 30            # 近 N 日综合涨幅(%，各上榜日涨跌幅累加)
      net_fund_flow: 20             # 近 N 日资金净流入(亿元，流入−流出)
      no_hit: 0                     # 个股概念均未命中窗口概念池时的分数
    fit_rank:                       # 概念粘合度加权（同花顺 F10）
      weight_decay: 0.85            # rank=1 权重 1.0，rank=2 为 0.85，依次衰减
      max_concepts: 15               # 仅前 N 个粘合度概念参与加权

  # 主升浪战法：仅加速段 + 震荡剔除（不要求整理/启动）
  main_wave:
    min_ma_spread_pct: 0.8          # MA5 相对 MA20 最小发散(%)
    spread_accel_days: 5            # 发散度加速观察窗口（日）
    spread_accel_min_pct: 0.12      # 发散度相对 N 日前最小增量(%)
    choppy_lookback_days: 60        # 震荡剔除：回看交易日
    choppy_path_ratio: 3.5          # 路径/净涨幅 超过此值视为上蹿下跳
    choppy_flip_rate: 0.42          # 涨跌反转频率上限
    choppy_min_net_pct: 5.0         # 回看期内净涨幅低于此视为无趋势
    choppy_recent_days: 20          # 突破豁免：近 N 日净涨幅
    choppy_recent_min_net_pct: 3.0  # 突破豁免：近 N 日净涨幅下限（%）
    choppy_strong_net_pct: 12.0     # 回看净涨幅≥此值 → 主升浪，不判震荡无序
    choppy_strong_recent_net_pct: 8.0  # 近 N 日净涨幅≥此值 → 主升浪豁免
    choppy_strong_day_chg_pct: 5.0  # 当日涨幅≥此值且均线多头 → 豁免（盘中用现价）
    choppy_high_break_days: 60      # 现价接近 N 日高点 + 多头 → 豁免
    choppy_high_break_ratio: 0.97
    trend_ma20_floor: 0.985         # 趋势有效：现价不低于 MA20×此值
    trend_peak_spread_days: 15      # 近 N 日峰值发散（回调期 spread 可收窄）
    pullback_spread_ratio: 0.55     # 回调期允许的发散度下限 = min_spread×此值
    pullback_above_ma5_ratio: 1.02  # 价高于 MA5×此值视为加速段而非回调
    accel_price_ma5_ratio: 0.97     # 加速段：现价不低于 MA5×此值
    monthly_return_days: 22         # 保留：其他模块近 N 日涨幅参考
    pullback_ma_zone_low: 0.985     # 回调企稳：现价/MA10 下限
    pullback_ma_zone_high: 1.015    # 回调企稳：现价/MA10 上限
    ma5_break_ratio: 0.97           # 卖-趋势退出(慢口径,让利润飞)：现价<MA5×此值 且双根确认
    ma5_break_ratio_fast: 0.995     # 卖-止损(快口径,防闷杀)：现价<MA5×此值，单根即触发
    ma20_break_ratio: 0.995         # 卖-趋势衰竭：现价 < MA20×此值

    # 近端动能：发散双窗口、价强豁免、高位衰减、排序/买入
    spread_recent_days: 3            # 近 N 日发散不能从峰值持续回落
    spread_recent_max_drop_pct: 0.05
    spread_exempt_min_signals: 2     # 发散未加速时，满足几条仍算加速
    spread_exempt_day_chg_pct: 3.0
    momentum_recent_5d_min_pct: 8.0  # 价强豁免：近5日涨幅
    momentum_high_break_days: 20
    momentum_high_break_ratio: 0.97
    momentum_fade_min_signals: 2      # 满足几条判高位动能衰减
    momentum_fade_ignore_day_chg_pct: 3.0   # 价强豁免且当日涨幅≥此值时不判衰减
    momentum_fade_ignore_net5_pct: 12.0     # 价强豁免且近5日涨幅≥此值时不判衰减
    momentum_intraday_fade_min_pct: 5.0     # 自日内高点回撤≥此值且低于均价 → 日内动能衰减
    momentum_intraday_require_below_avg: true
    momentum_intraday_fade_score_penalty: 22.0  # 日内冲高回落时动能分额外扣分
    momentum_fade_spread_drop_pct: 0.3
    momentum_fade_body_ratio: 0.6
    momentum_fade_volume_ratio: 0.8
    momentum_fade_penalty_per_signal: 4.0
    momentum_fade_penalty_max: 12.0
    momentum_buy_min_score: 45.0      # 买入：动能分下限
    momentum_buy_rank_weight: 0.2    # 买入排序：总分 + 动能分×权重
    momentum_score_blend: 0.25        # 主升维度评分与动能分混合比例
    momentum_rank_weights:
      recent_return: 0.30
      spread_trend: 0.25
      volume_price: 0.20
      structure: 0.15
      stability: 0.10

  # 仓位：按强势/震荡/弱势（infer_regime → 总仓 80% / 50% / 20%）
  # 多候选买入预算按评分比例分配 room，单票仍受 single_pct 上限约束
  position:
    强势:
      total_pct: 80                 # 总仓位上限(%)
      max_stocks: 5                 # 最多持仓只数（满配单票约 16%）
    震荡:
      total_pct: 50
      max_stocks: 3                 # 满配单票约 16.7%
    弱势:
      total_pct: 20
      max_stocks: 2                 # 满配单票约 10%

  # 买入：涨幅过高不追
  buy:
    pre_market:
      max_change_pct: 8.0           # 盘前模式允许的最大涨幅(%)
    during_market:
      max_change_pct: 8.0           # 盘中默认涨幅上限(%)
      max_change_by_kind:
        回调企稳: 8.0
        上升途中: 9.5
      ascent_high_score: 78           # 上升途中且评分≥此值可再放宽
      ascent_high_score_max_chg: 8.0
      concept_theme_min_score: 55     # 买入时 concept_theme 维度最低分（缺失则不拦）
      block_ascent_in_weak_regime: true
      block_ascent_when_profit_null: true
      weak_market:
        enabled: true
        block_new_buys: true
        treat_null_profit_as_weak: true
        null_profit_threshold_delta: 2   # 赚钱效应 null 时买入线 +2
        up_down_ratio_min: 0.25          # 上涨/下跌低于此值暂停新开仓
        buy_threshold_delta: 3             # 弱势档买入线 +3
      recent_gain_guard:                 # 近端涨幅：条件过滤，非硬禁（强者恒强豁免）
        enabled: true
        apply_to_kinds:
          - 上升途中
        lookback_days: 3
        limits:
          强势: 25.0
          震荡: 18.0
          弱势: 12.0
        exempt_min_score: 80
        exempt_require_no_momentum_decay: true
      strong_market:                # 强市动态放宽（独立于仓位档位 infer_regime）
        enabled: true
        index_min_pct: 1.0          # 上证涨幅 ≥ 此值
        zt_min: 80                  # 涨停家数 ≥ 此值
        require_up_gt_down: true
        max_change_pct: 9.5         # 强市追高线上调
        buy_threshold_delta: -2     # 买入线略降（如 72→70）
      intraday:                       # 盘中买入分时过滤（仅 during_market）
        enabled: true
        require_above_avg: true
        avg_margin_pct: 0.0
        skip_strength_min_day_chg: 5.0
        fund_improve_min_delta_wan: 50
        min_day_change_pct: -1.5
        hard_net_outflow_wan: 8000
        drawdown_from_high:           # 距日内高点回撤上限(%)；非写死，按买点/强度分档
          default_pct: 3.0
          by_buy_kind:
            回调企稳: 3.0
            上升途中: 4.0
          strong_day_chg_pct: 5.0     # 当日涨幅≥此值时用 strong_day_pct
          strong_day_pct: 5.0
          require_below_avg: true     # true=仅「回撤超限且跌破均价」才拒买
        momentum_groups:              # 三组：组间 AND，组内 OR
          enabled: true
          slope_minutes: 5
          slope_warmup_bars: 10
          min_endpoint_slope_pct: 0.0
          min_endpoint_slope_pct_early: -0.05
          min_ols_slope_pct: 0.0
          pullback_min_endpoint_slope_pct: -0.15
          pullback_min_ols_slope_pct: -0.15
          ascent_relax_on_strong_day: true   # 上升途中+强势日：组1 + (动量|资金)
          ascent_relax_min_day_chg: 5.0

  # 卖出：止损（紧急）+ 趋势破位；非跌停趋近须 14:30 后
  sell:
    stop_loss_pct: -7.0             # 须同时趋势破位(快口径)；单独浮亏不触发；防闷杀硬止损
    stop_loss_require_trend_break: true
    stop_loss_eval_after_late_session: true  # 14:30 前不判止损（防早盘深跌午后拉回误卖）
    stop_loss_exempt_min_day_chg_pct: 3.0   # 当日涨幅≥此值不止损（涨停/强阳）
    stop_loss_exempt_near_limit_up: true
    limit_up_exempt_margin_pct: 0.5         # 距涨停价≤0.5% 视为近涨停
    urgent_sell_kinds: []                  # 仅趋近跌停可早于 14:30（见 sell_policy）
    limit_down_approach_margin_pct: 1.0
    intraday_weakness:              # 已关闭：不破趋势不卖
      enabled: false
      modes:
        - during_market
      max_drop_from_high_pct: 3.0
      avg_break_margin_pct: 0.15
      min_minute_bars: 8
      lookback_minutes: 10
      min_recent_drop_pct: 0.25
      min_down_bars_ratio: 0.55
      require_recent_weakness: true
    late_session_after: "14:30"     # 非紧急卖出须在此之后成交
    late_session_final_only: true
    late_session_kinds:
      - 破5日线
      - 趋势衰竭
    time_stop:                      # 已关闭：不破趋势不卖
      enabled: false
      min_hold_trading_days: 5      # 买入后至少 N 个交易日
      min_pnl_pct: -3.0             # 低于此由 stop_loss 处理；本规则覆盖 [-3%, +5%] 横盘区
      max_pnl_pct: 5.0              # 浮盈超过此豁免（继续持股，非止盈卖）
      sideways_lookback_days: 5     # 近 N 日振幅/净波动判定横盘
      max_range_pct: 5.5            # 近 N 日 (高-低)/均价 ≤ 此值(%)
      max_net_move_pct: 3.0         # 近 N 日 |末-始|/始 ≤ 此值(%)

# -----------------------------------------------------------------------------
# push — 推送展示过滤（不影响加自选/买卖/评分，仅在推送时过滤展示标的）
# -----------------------------------------------------------------------------
push:

  # 自选推送价格区间：盘中「自选异动」与晚间「自选更新」仅推送现价落在
  # [min, max] 区间的标的；加自选、买卖、评分、落盘均不受此限制。
  # enabled 默认 true；min/max 为 null 表示该侧无边界（即不过滤）。
  watchlist_price_range:
    enabled: true
    min: 5                # 现价下限（元），含；null=无下限
    max: 150              # 现价上限（元），含；null=无上限

  # 自选推送评分过滤：晚间「自选更新」仅推送当天评分 ≥ min_score 的标的
  # （加自选/买卖/落盘不受限，hysteresis 死区保留但不再推送）。
  # min_score 未配置时默认取 scoring.watchlist_threshold（70）。
  watchlist_score_filter:
    enabled: true
    min_score: 70         # null=取 scoring.watchlist_threshold
