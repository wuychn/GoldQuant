gates:
  trading:
    time_validation_enabled: true
    simulation:
      commission_rate: 0.0001
      min_commission: 5.0
      stamp_tax_rate: 0.0005
      transfer_fee_rate: 1.0e-05
      slippage_pct: 0.001
      slippage_model: sqrt_law
      slippage_sqrt_k: 0.5
      slippage_max_pct: 0.008
      partial_fill_enabled: true
      participation_rate: 0.1
      main_limit_pct: 9.9
      gem_limit_pct: 19.9
  symbol_pool:
    prefixes:
    - '60'
    - '00'
    - '30'
    exclude_st: true
    # [僵尸 r1] 候选池过滤未读此键；universe 默认 min_list_days=120（schema.py）
    min_listing_days: 60
  circuit_breaker:
    index_drop_pct: -2.0
  daily_loss_limit_pct: -3.0
  stoploss_cooldown_days: 3
  block_same_day_rebuy_after_sell: true
  # [僵尸 r1] regime 分档总仓位；r3 TargetPortfolio 用 target_vol + MVO，不读此段
  position:
    强势:
      total_pct: 80
      max_stocks: 5
    震荡:
      total_pct: 50
      max_stocks: 3
    弱势:
      total_pct: 20
      max_stocks: 2
  buy:
    pre_market:
      max_change_pct: 8.0
    during_market:
      max_change_pct: 8.0
      max_change_by_kind:
        回调企稳: 8.0
        上升途中: 9.5
      intraday:
        # [僵尸 r1] 盘中买入门禁；r3 用 compose_intraday_alpha（见 ops/modes._intraday_buy_block）
        enabled: true
        require_above_avg: true
        avg_margin_pct: 0.0
        skip_strength_min_day_chg: 5.0
        fund_improve_min_delta_wan: 50
        min_day_change_pct: -1.5
        hard_net_outflow_wan: 8000
        drawdown_from_high:
          default_pct: 3.0
          by_buy_kind:
            回调企稳: 3.0
            上升途中: 4.0
          strong_day_chg_pct: 5.0
          strong_day_pct: 5.0
          require_below_avg: true
  sell:
    limit_up_exempt_margin_pct: 0.5
    limit_down_approach_margin_pct: 1.0
    late_session_after: '14:30'
    late_session_final_only: true
    late_session_kinds:
    - 破5日线
    - 趋势衰竭
    time_stop:
      enabled: false
      min_hold_trading_days: 5
      min_pnl_pct: -3.0
      max_pnl_pct: 5.0
      sideways_lookback_days: 5
      max_range_pct: 5.5
      max_net_move_pct: 3.0
push:
  watchlist_price_range:
    enabled: true
    min: 5
    max: 150
research:
  regime_v2_enabled: true
  min_oos_sharpe: 0.5
  bootstrap_samples: 1000
  ml_objective: sharpe
  fdr_alpha: 0.05
  factors:
    holding_horizon_days: 5
    min_cross_section: 5
    strict_oos_weights: true
    ic_horizons: [5, 10, 20]
  promote:
    min_samples: 80
    min_total_ic_mean: 0.02
    min_total_icir: 0.3
    min_oos_sharpe: 0.5
portfolio:
  allocator_v2_enabled: true
  optimizer: mvo
  optimizer_mvo:
    risk_aversion: 2.0
  covariance:
    method: ewma
  # [僵尸 r1] TargetPortfolio 无 continuous_position 字段
  continuous_position:
    enabled: true
    min_pct: 20
    max_pct: 80
  risk_budget:
    enabled: true
    score_vol_blend: 0.5
    vol_lookback: 14
    vol_floor_pct: 1.0
    participation_cap_enabled: true
  constraints:
    enabled: true
    max_concept_pct: 40
    max_industry_pct: 40
  style_exposure:
    # alpha_weighted 在 optimizer=mvo 且协方差可用时不生效（MVO 分支优先）
    alpha_weighted: true
    alpha_shrink: 0.4
    max_small_cap_pct: 50
    max_high_mom_pct: 60
  risk:
    max_drawdown_halt_enabled: true
    max_drawdown_pct: 15
    halt_days: 5
    force_reduce_daily_loss_pct: -5.0
candidate:
  popularity_limit: 20
  zt_min_boards: 3
  cxg_labels:
  - 创月新高
  - 半年新高
  - 一年新高
  - 历史新高
  include_zt_pool: false
  include_ths_rank_pool: true
  watchlist_retain_days: 7
  watchlist_observe_max_days: 30
  universe:
    enabled: true
    min_adv_yi: 1.0
    adv_lookback: 20
    max_crowding_rank: null
    participation_rate: 0.1
