# =============================================================================
# GoldQuant 量化统一配置
# =============================================================================
# 策略：仅主升浪战法
#
# 加载顺序
#   1. quant/config/quant.yml（本文件，包内默认）
#   2. ~/.quant/config/quant.yml（用户覆盖，deep merge）
#   3. ~/.quant/config/ml_calibration.yml（ML 离线校准，apply: true 时生效）
# =============================================================================

# -----------------------------------------------------------------------------
# scoring — 评分引擎（100 分制，与硬门禁分离）
# -----------------------------------------------------------------------------
scoring:

  # 总分阈值：各场景最低通过分
  watchlist_threshold: 65   # 晚间复盘加自选
  buy_threshold: 72         # 产生买入原始信号
  sell_threshold: 45        # 持仓「去弱留强」：低于此分可触发卖出

  # 晚间候选池（初筛在 quant/pool/sources.py，问财+enrich 在 quant/pool/pipeline.py）
  candidate:
    popularity_limit: 30        # 人气榜初筛：取前 N
    zt_min_boards: 2            # 涨停池初筛：连板数 ≥
    pkyd_dual_tag_limit: 20     # 盘口异动：加速过滤后取前 N（按近一月涨幅）
    pkyd_prefilter_pool: 60     # 盘口异动：enrich 前双标签池上限
    pkyd_labels:                # 东财盘口异动类型
      - 60日新高
      - 60日大幅上涨
    include_zt_pool: true       # 涨停池作为独立候选来源
    include_pkyd_pool: true      # 盘口异动作为独立候选来源
    watchlist_retain_days: 5     # 末次入选后 N 个交易日未再入选则移出自选

  # 评分维度：enabled 关闭则不参与；weight 为加权系数
  dimensions:
    main_wave:              # 主升浪加速段形态 + 买点
      enabled: true
      weight: 22
    concept_theme:          # 个股概念与板块概念权重共振
      enabled: true
      weight: 18
    popularity_rank:        # 同花顺人气排名
      enabled: true
      weight: 10
    pkyd_signal:            # 盘口异动（60日新高 / 60日大幅上涨）
      enabled: true
      weight: 5
      base_score: 55
      score_per_tag: 22
    technical:              # MACD、均线等技术指标
      enabled: true
      weight: 9
    stock_history:          # 近30日：5%+涨幅占比、均线发散、周/月线向上
      enabled: true
      weight: 11
      lookback_days: 30
      big_move_pct: 5.0           # 单日涨幅≥此值(%) 计为大涨日
      big_move_weight: 0.40       # 大涨占比子分权重
      ma_diverge_weight: 0.35     # 均线发散向上子分权重
      weekly_monthly_weight: 0.25 # 周/月线向上子分权重
      min_ma_spread_pct: 0.8      # MA5 相对 MA20 最小发散(%)
    stock_fund_flow:        # 个股资金流
      enabled: true
      weight: 8
    market_index:           # 大盘指数涨跌
      enabled: true
      weight: 4
    market_sentiment:       # 赚钱效应（涨跌比 + 涨停家数）
      enabled: true
      weight: 4
    market_fund_flow:       # 大盘资金流
      enabled: true
      weight: 4
    zt_count:               # 涨停家数（与 market_sentiment 重叠，已关闭）
      enabled: false
      weight: 0
    zt_height:              # 连板高度
      enabled: true
      weight: 3
    minute_bars:            # 分钟 K 形态
      enabled: false
      weight: 0
    us_overnight:           # 美股隔夜（数据未接入，暂关闭）
      enabled: false
      weight: 0
    stock_news:             # 个股新闻情绪
      enabled: false
      weight: 0

# -----------------------------------------------------------------------------
# gates — 硬门禁 + 战法参数 + 三确认（不可被 LLM 修改）
# -----------------------------------------------------------------------------
gates:

  # 模拟成交时段校验（executor.py）
  trading:
    time_validation_enabled: false  # true=仅连续竞价时段允许成交

  # 可交易标的池
  symbol_pool:
    prefixes: ["60", "00", "30"]    # 沪主/深主/创业板
    exclude_st: true                # 排除 ST
    min_listing_days: 60            # 最短上市天数（预留）

  # 全局熔断：指数大跌、连续缩量
  circuit_breaker:
    index_drop_pct: -2.0            # 上证涨跌幅 ≤ 此值 → 禁止新开仓
    shrink_volume_days: 3           # 连续缩量观察天数
    shrink_volume_ratio: 0.8        # 末量/首量 < 此比例视为缩量

  daily_loss_limit_pct: -3.0        # 当日已实现盈亏占总资产 ≤ 此值 → 禁止新开仓
  stoploss_cooldown_days: 3         # 止损卖出后 N 日内不再买同代码
  block_same_day_rebuy_after_sell: true  # 当日卖出过的代码当日不再买入

  # 三确认：同 code+方向+signal_kind 连续 N 次信号才 execute
  confirmation:
    required_count: 3
    skip_count_modes:             # 这些模式只生成原始信号，不计入三确认
      - pre_market                  # 首次计数从 09:37 盘中开始
    # 按 signal_kind 覆盖 min/max 间隔（分钟）
    by_kind:
      破5日线:
        min_interval_minutes: 15
        max_interval_minutes: 120
      趋势衰竭:
        min_interval_minutes: 30
        max_interval_minutes: 4320  # 72h，允许多日逐步确认
    # 默认间隔（按市场状态 强势/震荡/弱势）
    强势:
      min_interval_minutes: 15
      max_interval_minutes: 120
    震荡:
      min_interval_minutes: 10      # 与盘中 10 分钟调度对齐
      max_interval_minutes: 180
    弱势:
      min_interval_minutes: 30
      max_interval_minutes: 240

  # 概念板块：滑动窗口四榜快照 + concept_theme 概念权重；仅晚间复盘写入状态
  concept_tracker:
    board_limit: 10                 # 每日快照：涨/跌/流入/流出榜各取前 N
    lookback_days: 10               # 指标计算窗口（交易日，含当日 payload）
    # past_board_days 默认 lookback_days-1：评分池 = 文件过去 N 日榜 + 当日榜
    score_weights:                  # 概念权重：入选次数 50 + 综合涨幅 30 + 净流入 20
      selection_count: 50           # 近 N 日累计入选涨幅榜前十次数
      composite_gain: 30            # 近 N 日综合涨幅(%，各上榜日涨跌幅累加)
      net_fund_flow: 20             # 近 N 日资金净流入(亿元，流入−流出)
      no_hit: 0                     # 个股概念均未命中窗口概念池时的分数

  # 主升浪战法：仅加速段 + 震荡剔除（不要求整理/启动）
  main_wave:
    min_ma_spread_pct: 0.8          # MA5 相对 MA20 最小发散(%)
    spread_accel_days: 5            # 发散度加速观察窗口（日）
    spread_accel_min_pct: 0.12      # 发散度相对 N 日前最小增量(%)
    choppy_lookback_days: 60        # 震荡剔除：回看交易日
    choppy_path_ratio: 3.5          # 路径/净涨幅 超过此值视为上蹿下跳
    choppy_flip_rate: 0.42          # 涨跌反转频率上限
    choppy_min_net_pct: 5.0         # 回看期内净涨幅低于此视为无趋势
    trend_ma20_floor: 0.985         # 趋势有效：现价不低于 MA20×此值
    trend_peak_spread_days: 15      # 近 N 日峰值发散（回调期 spread 可收窄）
    pullback_spread_ratio: 0.55     # 回调期允许的发散度下限 = min_spread×此值
    pullback_above_ma5_ratio: 1.02  # 价高于 MA5×此值视为加速段而非回调
    accel_price_ma5_ratio: 0.97     # 加速段：现价不低于 MA5×此值
    monthly_return_days: 22         # 盘口异动排序：近 N 日涨幅
    pullback_ma_zone_low: 0.985     # 回调企稳：现价/MA10 下限
    pullback_ma_zone_high: 1.015    # 回调企稳：现价/MA10 上限
    ma5_break_ratio: 0.995          # 卖-破5日线：现价 < MA5×此值
    ma20_break_ratio: 0.995         # 卖-趋势衰竭：现价 < MA20×此值

  # 仓位：按强势/震荡/弱势（infer_regime → 总仓 80% / 50% / 20%）
  # 单票买入预算 = 剩余仓位 / 剩余空位，满配时合计 ≈ total_pct
  position:
    强势:
      total_pct: 80                 # 总仓位上限(%)
      max_stocks: 5                 # 最多持仓只数（满配单票约 16%）
    震荡:
      total_pct: 50
      max_stocks: 3                 # 满配单票约 16.7%
    弱势:
      total_pct: 20
      max_stocks: 2                 # 满配单票约 10%

  # 买入：涨幅过高不追
  buy:
    pre_market:
      max_change_pct: 8.0           # 盘前模式允许的最大涨幅(%)
    during_market:
      max_change_pct: 8.0           # 盘中模式允许的最大涨幅(%)
      intraday:                       # 盘中买入分时过滤（仅 during_market）
        enabled: true
        require_above_avg: true       # 现价须在分时均价上方
        avg_margin_pct: 0.0           # 高于均价的幅度(%)
        lookback_minutes: 15          # 分时回看分钟数
        max_recent_drop_pct: 0.35     # 近 N 分钟累计跌幅上限(%)
        max_down_bars_ratio: 0.55     # 近 N 分钟下跌 K 线占比上限
        require_fund_flow_improve: true # 后半段分时资金强于前半段
        max_drop_from_high_pct: 2.5   # 距日内高点最大回撤(%)
        min_day_change_pct: -1.5      # 当日涨幅下限(%)
        hard_net_outflow_wan: 8000    # 当日净流出硬上限(万元)

  # 卖出：止损 + 神奇2点30 最终确认
  sell:
    stop_loss_pct: -5.0             # 浮亏 ≤ 此值 → 止损（不受 14:30 限制）
    late_session_after: "14:30"     # 趋势类卖出第 3 次确认须在此之后
    late_session_final_only: true     # true=第1/2次可早于此，第3次须晚于此
    late_session_kinds:               # 适用神奇2点30 的 signal_kind
      - 破5日线
      - 趋势衰竭
      - 评分走弱
