# ML 校准输出示例 — 覆盖 quant.yml 中 scoring/gates 部分字段
# 写入路径：~/.quant/config/ml_calibration.yml
# 生效：apply: true 时，下次 load_scoring_config / load_gates_config 自动合并

generated_at: "2026-05-26 20:00:00"
method: grid
sample_count: 45
apply: true

thresholds:
  watchlist_threshold: 65
  buy_threshold: 75
  sell_threshold: 42

dimension_weights:
  main_wave: 24.0
  concept_theme: 14.0
  popularity_rank: 11.0

# 持续确认（按市场状态，写入 quant.yml gates.confirmation）
confirmation:
  default_persistence_minutes: 15
  default_min_consecutive_runs: 2
  强势:
    persistence_minutes: 10
    min_consecutive_runs: 2
    max_window_minutes: 120
  震荡:
    persistence_minutes: 15
    min_consecutive_runs: 2
    max_window_minutes: 180
  弱势:
    persistence_minutes: 30
    min_consecutive_runs: 3
    max_window_minutes: 240

main_wave:
  min_ma_spread_pct: 0.9
  leader_max_rank: 12

metrics:
  f1: 0.58

notes: []
